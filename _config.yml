# Site settings. Restart `jekyll serve` after editing this file.

title: Guilherme Lindenmeyer
tagline: Economics PhD student, UW–Madison
description: >-
  Third-year PhD student in Economics at the University of Wisconsin–Madison,
  working in industrial organization: digital platforms, antitrust, and regulation.
url: https://gslindenmeyer.github.io
baseurl: ""
lang: en
timezone: America/Chicago

author:
  name: Guilherme Lindenmeyer
  email: schultzlinde@wisc.edu

# Links shown under the bio, in this order
links:
  - label: CV
    url: /files/CV.pdf
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=9WOVf3AAAAAJ
  - label: LinkedIn
    url: https://www.linkedin.com/in/guilherme-lindenmeyer/

# Header menu
nav:
  - label: About
    url: /
  - label: Research
    url: /research/
  - label: Teaching
    url: /teaching/
  - label: CV
    url: /files/CV.pdf

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /images/gui.jpg

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - vendor
  - node_modules
