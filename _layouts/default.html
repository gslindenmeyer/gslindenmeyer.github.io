<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Dark by default; apply a saved choice before the page paints
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
  <link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}">
  <meta name="theme-color" content="#151618" id="theme-color">
</head>
<body{% if page.url == "/" %} class="home"{% endif %}>
  <header class="bar">
    <nav class="nav" aria-label="Main">
      <a class="who" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <span class="menu">
        {%- for item in site.nav -%}
        <a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
        {%- endfor -%}
        <button class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </span>
    </nav>
  </header>

  <main class="main">
    {{ content }}
  </main>

  <footer class="foot">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }} &middot; Updated {{ site.time | date: "%B %Y" }}</p>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
